<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS grid-gap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành CSS | Thuộc tính grid-gap</h1>

    <!-- Ví dụ 1: Khoảng cách hàng và cột bằng nhau -->
    <section class="demo-section">
        <h2>Ví dụ 1: Thiết lập khoảng cách giữa hàng và cột bằng nhau (grid-gap: 20px)</h2>
        <div class="grid-container example-1">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </section>

    <!-- Ví dụ 2: Khoảng cách hàng và cột khác nhau -->
    <section class="demo-section">
        <h2>Ví dụ 2: Thiết lập khoảng cách hàng và cột khác nhau (grid-gap: 30px 10px)</h2>
        <div class="grid-container example-2">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </section>
</body>
</html>
